---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
spec:
  interval: 24h
  targetNamespace: n8n
  sourceRef:
    kind: GitRepository
    name: n8n
  path: "./kubernetes"
  prune: true
  timeout: 5m
  wait: true
  images:
    - name: postgres
      newTag: "18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: n8n
      namespace: n8n
  postBuild:
    # Preserve n8n-hosting's runtime PostgreSQL environment references while
    # resolving only the ResourceSet-generated image variable.
    substitute:
      POSTGRES_NON_ROOT_USER: "$${POSTGRES_NON_ROOT_USER}"
      POSTGRES_NON_ROOT_PASSWORD: "$${POSTGRES_NON_ROOT_PASSWORD}"
      POSTGRES_DB: "$${POSTGRES_DB}"
    substituteFrom:
      - kind: ConfigMap
        name: n8n-image-auto

  patches:
    - patch: |
        - op: add
          path: /spec/template/spec/containers/0/envFrom
          value:
            - secretRef:
                name: n8n-secret
            - configMapRef:
                name: n8n-config
        - op: replace
          path: /spec/template/spec/containers/0/image
          # Escape the outer apps Kustomization substitution so the n8n
          # Kustomization resolves this value from n8n-image-auto post-build.
          value: $${image}
      target:
        kind: Deployment
        name: n8n
        namespace: n8n
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: n8n
          namespace: n8n
        spec:
          template:
            spec:
              containers:
                - name: n8n
                  env:
                    - name: N8N_PROTOCOL
                      value: https
                    - name: N8N_SSL_CERT
                      value: /etc/n8n/tls/tls.crt
                    - name: N8N_SSL_KEY
                      value: /etc/n8n/tls/tls.key
                    # Bound V8 below the container limit while giving the current
                    # n8n image enough heap and non-heap runtime headroom.
                    - name: NODE_OPTIONS
                      value: --max-old-space-size=1024
                  resources:
                    requests:
                      memory: 512Mi
                    limits:
                      memory: 2Gi
                  volumeMounts:
                    - name: n8n-tls
                      mountPath: /etc/n8n/tls
                      readOnly: true
              volumes:
                - name: n8n-tls
                  secret:
                    secretName: n8n-tls
      target:
        kind: Deployment
        name: n8n
        namespace: n8n
    - patch: |
        - op: add
          path: /metadata/annotations
          value:
            external-dns.alpha.kubernetes.io/hostname: n8n.${PRIVATE_DOMAIN}
        - op: replace
          path: /spec/type
          value: ClusterIP
        - op: replace
          path: /spec/ports/0/port
          value: 443
      target:
        kind: Service
        name: n8n
        namespace: n8n
