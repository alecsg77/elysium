apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  releaseName: plex
  chart:
    spec:
      chart: ./charts/onechart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: plex-helm-values
      optional: true
    - kind: ConfigMap
      name: plex-image-auto
      valuesKey: values.yaml
  values:
    vars:
      PUID: ${PUID:=1000}
      PGID: ${PGID:=1000}
      TZ: ${TZ:=Etc/UTC}
      VERSION: docker
    podSecurityContext:
      fsGroup: ${PGID:=1000}
    volumes:
      - name: storage
        size: "100Mi"
        path: /config
        subPath: plex/config
        existingClaim: pvc-storage
      - name: library
        size: "100Mi"
        path: /media/library
        existingClaim: pvc-library
      - name: transcode
        size: "10Gi"
        path: /transcode
      - name: backups
        size: "500Mi"
        path: /backups
        subPath: plex
        existingClaim: pvc-backups
    containerPort: 32400
    probe:
      enabled: true
      path: /identity
      settings:
        initialDelaySeconds: 10
        timeoutSeconds: 5
    livenessProbe:
      enabled: true
      path: /identity
      settings:
        initialDelaySeconds: 15
        timeoutSeconds: 10
    podSpec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    container:
      ports:
        - name: http
          containerPort: 32400
          hostPort: 32400
