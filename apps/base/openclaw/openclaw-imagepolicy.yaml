---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: openclaw
spec:
  image: ghcr.io/openclaw/openclaw
  interval: 24h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openclaw-policy
spec:
  imageRepositoryRef:
    name: openclaw
  filterTags:
    # Only consider "pure" CalVer tags (e.g. 2026.6.34), which are multi-arch
    # manifest lists equivalent to the slim variant currently in use.
    # Excludes variant/pre-release suffixes such as -slim-amd64, -browser-amd64,
    # -beta.N, -arm64, and release-publish/* tags.
    pattern: '^(?P<semver>\d+\.\d+\.\d+)$'
    extract: '$semver'
  policy:
    semver:
      range: ">=0.0.0"
  digestReflectionPolicy: Always
  interval: 24h
