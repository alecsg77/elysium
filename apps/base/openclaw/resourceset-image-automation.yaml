# Gitless image automation: the provider selects one permitted tag and its immutable digest.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: openclaw-image
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 24h
  labels:
    app.kubernetes.io/component: image-automation
    app.kubernetes.io/part-of: openclaw
spec:
  # The adapter emits exactly one validated stable input. Do not supply defaults:
  # an unavailable or incomplete adapter response must not advance the image.
  type: ExternalService
  url: http://router.fission.svc.cluster.local/openclaw/release
  insecure: true
  filter:
    limit: 1
---
# The ResourceSet owns only this ConfigMap; the HelmRelease remains Git-managed.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: openclaw-image
  annotations:
    fluxcd.controlplane.io/reconcileTimeout: 5m
  labels:
    app.kubernetes.io/component: image-automation
    app.kubernetes.io/part-of: openclaw
spec:
  # Freeze the deployed image while restoring its supported startup/migration
  # path. Restore inputsFrom only after the Gateway is healthy.
  inputs:
    - repository: ghcr.io/openclaw/openclaw
      tag: "2026.10.10"
      digest: sha256:1e5ee6c7d02d5b5f64f9cf26a30c7ef7d4ec292f0d25fa590f4b7e103e8bf799
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/component: image-automation
      app.kubernetes.io/part-of: openclaw
  resourcesTemplate: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: openclaw-image-auto
      namespace: << inputs.provider.namespace >>
      labels:
        reconcile.fluxcd.io/watch: Enabled
    data:
      values.yaml: |
        image:
          repository: << inputs.repository | quote >>
          tag: << inputs.tag | quote >>
          digest: << inputs.digest | quote >>
