# Gitless image automation: the provider selects one permitted tag and its immutable digest.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: error-pages-image
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 24h
  labels:
    app.kubernetes.io/component: image-automation
    app.kubernetes.io/part-of: error-pages
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/tarampampam/error-pages
  defaultValues:
    repository: ghcr.io/tarampampam/error-pages
  filter:
    semver: '3.x'
    limit: 1
---
# The ResourceSet owns only this ConfigMap. The HelmRelease/Kustomization remains Git-managed.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: error-pages-image
  annotations:
    fluxcd.controlplane.io/reconcileTimeout: 5m
  labels:
    app.kubernetes.io/component: image-automation
    app.kubernetes.io/part-of: error-pages
spec:
  # Emergency rollback pin: this temporarily replaces inputsFrom with the
  # verified current image and tests the documented auto-to-pinned handoff.
  inputs:
    - provider:
        namespace: default
      repository: ghcr.io/tarampampam/error-pages
      tag: "3.8.1"
      digest: "sha256:b8ded6f847df91075429cf79cb9491bfd7d96de69936555498a2ff0614e003e4"
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/component: image-automation
      app.kubernetes.io/part-of: error-pages
  resourcesTemplate: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: error-pages-image-auto
      namespace: << inputs.provider.namespace >>
      labels:
        reconcile.fluxcd.io/watch: Enabled
    data:
      values.yaml: |
        image:
          repository: << inputs.repository | quote >>
          tag: << inputs.tag | quote >>
          digest: << inputs.digest | quote >>
      repository: << inputs.repository | quote >>
      tag: << inputs.tag | quote >>
      digest: << inputs.digest | quote >>
      image: "<< inputs.repository >>:<< inputs.tag >>@<< inputs.digest >>"
