apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: configarr
spec:
  releaseName: configarr
  chart:
    spec:
      chart: ./charts/cron-job
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: configarr-helm-values
      optional: true
    - kind: ConfigMap
      name: configarr-image-auto
      valuesKey: values.yaml
  values:
    schedule: "0 0 * * *" # Runs every 24 hours (daily at midnight)
    overrideCommand: false
    vars:
      PUID: ${PUID:=1000}
      PGID: ${PGID:=1000}
      TZ: ${TZ:=Etc/UTC}
      ROOT_PATH: /config
    podSecurityContext:
      runAsUser: ${PUID:=1000}
      runAsGroup: ${PGID:=1000}
      fsGroup: ${PGID:=1000}
    volumes:
      - name: storage
        size: "100Mi"
        path: /config
        subPath: configarr/config
        existingClaim: pvc-storage
