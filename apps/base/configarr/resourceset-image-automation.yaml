# Gitless image automation: the provider selects one permitted tag and its immutable digest.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: configarr-image
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 24h
  labels:
    app.kubernetes.io/component: image-automation
    app.kubernetes.io/part-of: configarr
spec:
  type: OCIArtifactTag
  url: oci://ghcr.io/raydak-labs/configarr
  defaultValues:
    repository: ghcr.io/raydak-labs/configarr
  filter:
    semver: '1.x'
    limit: 1
---
# The ResourceSet owns only this ConfigMap. The HelmRelease/Kustomization remains Git-managed.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: configarr-image
  annotations:
    fluxcd.controlplane.io/reconcileTimeout: 5m
  labels:
    app.kubernetes.io/component: image-automation
    app.kubernetes.io/part-of: configarr
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: configarr-image
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/component: image-automation
      app.kubernetes.io/part-of: configarr
  resourcesTemplate: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: configarr-image-auto
      namespace: << inputs.provider.namespace >>
      labels:
        reconcile.fluxcd.io/watch: Enabled
    data:
      values.yaml: |
        image:
          repository: << inputs.repository | quote >>
          tag: << inputs.tag | quote >>
      repository: << inputs.repository | quote >>
      tag: << inputs.tag | quote >>
      digest: << inputs.digest | quote >>
      image: "<< inputs.repository >>:<< inputs.tag >>@<< inputs.digest >>"
