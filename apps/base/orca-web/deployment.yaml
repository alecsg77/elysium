apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orca-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orca-web
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/alecsg77/elysium/orca-web:1.0.0
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
