apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orca-hub-home
  annotations:
    # Preserve the profile and device grants if the app is removed from the overlay.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
