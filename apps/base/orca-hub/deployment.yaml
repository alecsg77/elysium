apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orca-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orca-hub
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: home-owner
          image: busybox:1.38.0
          command:
            - sh
            - -ec
            - chown 1000:1000 /home/coder; chmod 0700 /home/coder
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/coder
      containers:
        - name: orca
          image: ghcr.io/alecsg77/elysium/orca-hub:1.4.248
          env:
            - name: ORCA_PAIRING_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: orca-hub-access
                  key: pairing-address
          ports:
            - name: runtime
              containerPort: 6768
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: runtime
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: runtime
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /home/coder
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: orca-hub-home
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
