apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orca-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orca-hub
    spec:
      automountServiceAccountToken: false
      hostname: orca-hub
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: home-owner
          image: busybox:1.38.0
          command: [sh, -ec, 'chown 1000:1000 /home/coder && chmod 0700 /home/coder']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: home
              mountPath: /home/coder
      containers:
        - name: orca
          image: ghcr.io/alecsg77/elysium/orca-hub:1.0.0@sha256:22aeded0ce9c4475b462d78eb43a56956b0161434d0420623f79871e74f7ca27
          args: [--no-pairing]
          env:
            - name: ORCA_PAIRING_ADDRESS
              value: ws://127.0.0.1:6768
          ports:
            - name: http
              containerPort: 6768
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/coder
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: orca-hub-home
