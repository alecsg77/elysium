apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  releaseName: pihole
  chart:
    spec:
      chart: ./charts/onechart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: pihole-helm-values
      optional: true
    - kind: ConfigMap
      name: pihole-image-auto
      valuesKey: values.yaml
  values:
    vars:
      TZ: ${TZ:=Etc/UTC}
      FTLCONF_webserver_api_password: ''
      FTLCONF_webserver_port: '80'
      FTLCONF_webserver_paths_prefix: '/pihole'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_domain_name: 'cluster.local'
    podSecurityContext:
      fsGroup: ${PGID:=1000}
    volumes:
      - name: storage
        size: "100Mi"
        path: /etc/pihole
        subPath: pihole/config
        existingClaim: pvc-storage
    containerPort: 80
    container:
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          protocol: UDP
    ingress:
      path: /pihole
    ports:
      - name: http
        containerPort: 80
        protocol: TCP
      - name: dns-tcp
        containerPort: 53
        protocol: TCP
      - name: dns-udp
        containerPort: 53
        protocol: UDP
