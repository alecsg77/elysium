apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperclip
spec:
  upgrade:
    # Rolling back only the Deployment would strand it on the migrated volume.
    remediation: null
    strategy:
      name: RetryOnFailure
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: paperclip
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: paperclip
              spec:
                template:
                  spec:
                    # Kubelet must not change the modes of private files.
                    securityContext:
                      fsGroup: null
                      fsGroupChangePolicy: null
                    initContainers:
                      - name: migrate-data-ownership
                        image: "ghcr.io/paperclipai/paperclip@\
                          sha256:246f3f94292f0b324275f15f019fd0212c4423367dbad39b677cec17dee1342b"
                        command:
                          - /bin/sh
                          - -ec
                          - |
                            mountpoint -q /paperclip
                            special="$(find /paperclip -xdev -type f -perm /6000 -print -quit)"
                            test -z "$special"
                            find /paperclip -xdev -uid 1000 -exec chown -h 1001 {} +
                            find /paperclip -xdev -gid 1000 -exec chgrp -h 1001 {} +
                            remaining="$(find /paperclip -xdev \
                              \( -uid 1000 -o -gid 1000 \) -print -quit)"
                            test -z "$remaining"
                        securityContext:
                          runAsUser: 0
                          runAsGroup: 0
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                            add: ["CHOWN", "DAC_OVERRIDE"]
                        resources:
                          requests:
                            cpu: 50m
                            memory: 32Mi
                          limits:
                            cpu: 200m
                            memory: 64Mi
                        volumeMounts:
                          - name: data
                            mountPath: /paperclip
