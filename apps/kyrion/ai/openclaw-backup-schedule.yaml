apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: openclaw-backup
  namespace: ai
  annotations:
    # Keep scheduled backup, check, and retention jobs after a source-inventory error.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  backend:
    local:
      mountPath: /repository
    repoPasswordSecretRef:
      key: password
      name: openclaw-backup-repository
    volumeMounts:
      - mountPath: /repository
        name: repository
  # The repository requires supplemental GID 34. Do not use fsGroup here: it
  # can rewrite ownership on the application PVC selected for backup.
  podSecurityContext:
    runAsGroup: 1000
    runAsUser: 1000
    supplementalGroups:
      - 34
  resourceRequirementsTemplate:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  backup:
    activeDeadlineSeconds: 7200
    failedJobsHistoryLimit: 2
    labelSelectors:
      - matchLabels:
          app: openclaw
    schedule: '0 */6 * * *'
    successfulJobsHistoryLimit: 2
    volumes:
      - name: repository
        persistentVolumeClaim:
          claimName: openclaw-backup-repository
  check:
    activeDeadlineSeconds: 7200
    failedJobsHistoryLimit: 2
    schedule: '0 2 * * 0'
    successfulJobsHistoryLimit: 2
    volumes:
      - name: repository
        persistentVolumeClaim:
          claimName: openclaw-backup-repository
  prune:
    activeDeadlineSeconds: 7200
    failedJobsHistoryLimit: 2
    retention:
      keepDaily: 7
      keepHourly: 4
      keepMonthly: 12
      keepWeekly: 5
    schedule: '0 4 * * 0'
    successfulJobsHistoryLimit: 2
    volumes:
      - name: repository
        persistentVolumeClaim:
          claimName: openclaw-backup-repository
