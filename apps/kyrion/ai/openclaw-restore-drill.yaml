# Temporary, non-destructive rebaseline of the OpenClaw restore drill. It uses
# supplementalGroups instead of fsGroup to preserve restored application metadata.
apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: openclaw-restore-drill-rebaseline-1
  namespace: ai
spec:
  activeDeadlineSeconds: 7200
  backend:
    local:
      mountPath: /repository
    repoPasswordSecretRef:
      key: password
      name: openclaw-backup-repository
    volumeMounts:
      - mountPath: /repository
        name: repository
  failedJobsHistoryLimit: 2
  # Select the latest snapshot containing only the OpenClaw source PVC path.
  # Do not pin a snapshot ID or a restore-time filter in Git.
  paths:
    - /data/openclaw-home-pvc
  # The repository requires supplemental GID 34. Avoid fsGroup so the restore
  # does not mutate the restored application ownership and mode metadata.
  podSecurityContext:
    runAsGroup: 1000
    runAsUser: 1000
    supplementalGroups:
      - 34
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  restoreMethod:
    folder:
      # This scratch PVC is the only restore target; never restore to production.
      claimName: openclaw-restore-drill-rebaseline-1
  successfulJobsHistoryLimit: 2
  volumes:
    - name: repository
      persistentVolumeClaim:
        claimName: openclaw-backup-repository
