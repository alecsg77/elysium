# Temporary deny-all isolation for an authorized scratch-only restore diagnostic.
# It does not select production OpenClaw pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-restore-drill-diagnostic
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: restore-drill-diagnostic
  policyTypes:
    - Ingress
    - Egress
