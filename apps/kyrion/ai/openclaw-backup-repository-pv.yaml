apiVersion: v1
kind: PersistentVolume
metadata:
  name: openclaw-backup-repository
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 100Gi
  local:
    path: ${OPENCLAW_BACKUP_HOST_PATH}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ${BACKUP_NODE_NAME}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  volumeMode: Filesystem
