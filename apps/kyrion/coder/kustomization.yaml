apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coder

resources:
  - namespace.yaml
  - ../../base/coder
  - sealed-secrets.yaml
  - tls-certificate.yaml

patches:
  # JSON Patch to append the public and wildcard access URLs to the base env array.
  # Array append cannot be expressed as a Helm values override, so we keep this patch.
  - patch: |-
      - op: add
        path: "/spec/values/coder/env/-"
        value:
          name: CODER_ACCESS_URL
          value: "https://coder.${PRIVATE_DOMAIN}"
      - op: add
        path: "/spec/values/coder/env/-"
        value:
          name: CODER_WILDCARD_ACCESS_URL
          value: "*.coder.${PRIVATE_DOMAIN}"
      # Coder reads its TLS certificate when it starts. Bump this revision after
      # cert-manager replaces coder-tls so Flux rolls the pod with the new cert.
      - op: add
        path: "/spec/values/coder/podAnnotations/elysium.io~1tls-reload-revision"
        value: "2"
    target:
      kind: HelmRelease
      name: coder

configMapGenerator:
  - name: coder-db-helm-values
    literals: []
    options:
      disableNameSuffixHash: true
  - name: coder-helm-values
    files:
      - values.yaml=coder-overlay-values.yaml
    options:
      disableNameSuffixHash: true
  - name: coder-logstream-kube-helm-values
    files:
      - values.yaml=coder-logstream-kube-overlay-values.yaml
    options:
      disableNameSuffixHash: true
