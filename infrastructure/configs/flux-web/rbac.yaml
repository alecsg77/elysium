# The existing tsidp:viewer binding grants namespaced read access without Secrets.
# This adds only the cluster-scoped discovery permissions required by Flux Web UI.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-web-readonly
  labels:
    app.kubernetes.io/name: flux-operator
    app.kubernetes.io/component: web-ui
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - fluxcd.controlplane.io
    resources:
      - fluxinstances
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-readonly
  labels:
    app.kubernetes.io/name: flux-operator
    app.kubernetes.io/component: web-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-readonly
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: tsidp:viewer
