apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    transport: http
    readonly: true
    image:
      tag: v0.57.0
    serviceAccount:
      create: false
      automount: true
      name: flux-operator-mcp-readonly
    # The chart's generated binding is cluster-admin; use the reviewed role above.
    rbac:
      create: false
    networkPolicy:
      create: true
      ingress:
        # Allow approved in-cluster MCP clients to reach the internal HTTP endpoint.
        namespaces:
          - coder
          - ai
    ingress:
      enabled: false
    httpRoute:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
