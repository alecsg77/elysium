apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tsidp
  namespace: tailscale
  annotations:
    # Preserve tsidp's stateful authentication service during parent recovery.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  releaseName: tsidp
  dependsOn:
    - name: tailscale-operator
      namespace: flux-system
  chart:
    spec:
      chart: ./charts/onechart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 12h
  # tsidp's PVC contains its issuer keys, registered clients, and refresh-token
  # state. Retry in place instead of uninstalling failed installs or rolling back
  # failed upgrades, which can discard chart-managed state after a failed release.
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    image:
      repository: ghcr.io/tailscale/tsidp
      tag: v0.0.14
      digest: sha256:b3e7baf8dc0d309b8b34bedc286e38fd275daa302663e1b10f2ae774dff26b4a
      pullPolicy: IfNotPresent
    replicas: 1
    containerPort: 443
    ports:
      - name: https
        containerPort: 443
        svcPort: 443
    existingSecrets:
      - name: tsidp-auth
    vars:
      TAILSCALE_USE_WIP_CODE: "1"
      TS_ADVERTISE_TAGS: tag:tsidp
      TS_HOSTNAME: idp
      TS_STATE_DIR: /data
      TSIDP_LOG: info
    # Prevent the tsidp Service from injecting TSIDP_PORT=tcp://...:443.
    # tsidp interprets TSIDP_PORT as its integer listener-port configuration.
    podSpec:
      enableServiceLinks: false
    podSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    volumes:
      - name: tsidp-data
        path: /data
        size: 1Gi
        pvcAnnotations:
          helm.sh/resource-policy: keep
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
