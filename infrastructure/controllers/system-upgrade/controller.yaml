---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: system-upgrade
  namespace: flux-system
spec:
  interval: 24h
  # Keep controller source and the vendored Plan CRD on one reviewed release.
  # Upgrade this tag only through the R2 two-PR procedure.
  ref:
    tag: v0.20.1
  url: https://github.com/rancher/system-upgrade-controller.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade
  namespace: flux-system
spec:
  interval: 12h
  path: ./
  prune: true
  # The v0.20.1 root manifest still pins the controller image to v0.14.0.
  # Keep the reviewed source tag and running controller version aligned.
  images:
    - name: rancher/system-upgrade-controller
      newTag: v0.20.1
  sourceRef:
    kind: GitRepository
    name: system-upgrade
