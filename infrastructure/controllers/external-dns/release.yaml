---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare-secret
            key: apiToken
    sources:
      - service
    domainFilters:
      - ${PRIVATE_DOMAIN}
    registry: txt
    txtOwnerId: kyrion
    policy: sync
    extraArgs:
      - --publish-internal-services
      - --no-cloudflare-proxied
