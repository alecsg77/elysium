name: Build Images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [orca-hub]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Build and publish Linux amd64 image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          directory="images/$IMAGE_NAME"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_NAME"
          version="$(cat "$directory/VERSION")"
          test -n "$version"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image:$version" -t "$image:sha-$GITHUB_SHA" "$directory"
          docker push "$image:$version"
          docker push "$image:sha-$GITHUB_SHA"
