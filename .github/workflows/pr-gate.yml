name: PR Gate

on:
  # The workflow definition is always loaded from the default branch. Every PR
  # checkout below uses an explicit SHA and is treated as data, never as an
  # executable workflow/script source.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  CRDS_CATALOG_COMMIT: 59abc9f9403c92e3d8f8873e250ca10dcd5b2c0d
  ACTIONLINT_VERSION: 1.7.9
  ACTIONLINT_SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
      gitops: ${{ steps.changes.outputs.gitops }}
      helm: ${{ steps.changes.outputs.helm }}
      coder: ${{ steps.changes.outputs.coder }}
      actions: ${{ steps.changes.outputs.actions }}
      functions: ${{ steps.changes.outputs.functions }}
      quality_policy_changed: ${{ steps.changes.outputs.quality_policy_changed }}
      quality_inputs_changed: ${{ steps.changes.outputs.quality_inputs_changed }}
      yamllint_policy_changed: ${{ steps.changes.outputs.yamllint_policy_changed }}
      checkov_policy_changed: ${{ steps.changes.outputs.checkov_policy_changed }}
      kubeconform_policy_changed: ${{ steps.changes.outputs.kubeconform_policy_changed }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Detect applicable validation domains
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/detect_pr_gate_domains.py \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER" \
            --github-output "$GITHUB_OUTPUT"

  baseline:
    name: baseline
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - name: Check out proposed content as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted base configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: base
          persist-credentials: false

      - name: Keep quality-policy changes separate from scanned content
        env:
          QUALITY_POLICY_CHANGED: ${{ needs.detect.outputs.quality_policy_changed }}
          QUALITY_INPUTS_CHANGED: ${{ needs.detect.outputs.quality_inputs_changed }}
        run: |
          set -euo pipefail
          if [ "$QUALITY_POLICY_CHANGED" = true ] && [ "$QUALITY_INPUTS_CHANGED" = true ]; then
            echo "::error::Split quality-policy changes from manifests or functions evaluated by that policy."
            exit 1
          fi

      - name: Install YAML parser and linter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml yamllint

      - name: Ratchet manifest YAML quality against the trusted base
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          bash base/scripts/ci/run_quality_ratchet.sh \
            --tool yamllint \
            --base-root "$GITHUB_WORKSPACE/base" \
            --head-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --report-dir "$RUNNER_TEMP/quality-ratchet" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Reject yamllint policy changes that alter current debt
        if: needs.detect.outputs.yamllint_policy_changed == 'true'
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          bash base/scripts/ci/run_quality_ratchet.sh \
            --tool yamllint \
            --base-root "$GITHUB_WORKSPACE/base" \
            --head-root "$GITHUB_WORKSPACE" \
            --head-scan-root "$GITHUB_WORKSPACE/base" \
            --base-config "$GITHUB_WORKSPACE/base/.yamllint.yaml" \
            --head-config "$GITHUB_WORKSPACE/.yamllint.yaml" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --report-dir "$RUNNER_TEMP/quality-policy" \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --reject-removed

      - name: Upload YAML quality-ratchet report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: quality-ratchet-yamllint-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/quality-ratchet/quality-yamllint.json
            ${{ runner.temp }}/quality-policy/quality-yamllint.json
          if-no-files-found: warn
          retention-days: 7

      - name: Parse CI policy and function YAML
        run: |
          set -euo pipefail
          python3 base/scripts/ci/parse_yaml_paths.py \
            --root "$GITHUB_WORKSPACE" \
            --directory .github \
            --directory functions

      - name: Reject changed plaintext Secret manifests from the trusted diff
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 base/scripts/ci/check_changed_secrets.py \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER"

      - name: Scan the trusted base-to-head diff for leaked secrets
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash base/scripts/ci/scan_added_diff_with_gitleaks.sh "$GITHUB_WORKSPACE"

  critical:
    name: critical GitOps guard
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - name: Check out trusted base guard and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch proposed content as inert Git data
        env:
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/pr-head" "$HEAD_SHA"

      - name: Install guard dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Install checksum-verified kustomize for the trusted guard
        run: |
          set -euo pipefail
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Compare critical base and proposed resources
        run: |
          set -euo pipefail
          python3 scripts/ci/critical_change_guard.py \
            --base "$GITHUB_WORKSPACE" \
            --head "$RUNNER_TEMP/pr-head" \
            --policy .github/critical-resources.yaml \
            --report "$RUNNER_TEMP/critical-change-report.json"

      - name: Upload critical-change report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: critical-change-report-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/critical-change-report.json
          if-no-files-found: warn
          retention-days: 7

  gitops:
    name: GitOps validation
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.gitops == 'true'
    steps:
      - name: Check out proposed manifests as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out trusted GitOps validation helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: base
          persist-credentials: false

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: Render trusted base and proposed GitOps quality inputs
        run: |
          bash base/scripts/ci/render_quality_ratchet_targets.sh \
            --base-root "$GITHUB_WORKSPACE/base" \
            --head-root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/quality-ratchet" \
            --temp-root "$RUNNER_TEMP"

      - name: Install kubeconform and YAML parser
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Verify pinned CRD schema catalog availability
        run: |
          set -euo pipefail
          catalog="https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_COMMIT}"
          curl --fail --silent --show-error --location --retry 3 --output /dev/null \
            "$catalog/bitnami.com/sealedsecret_v1alpha1.json"
          curl --fail --silent --show-error --location --retry 3 --output /dev/null \
            "$catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json"

      - name: Verify trusted local kubeconform schema bundle
        run: |
          set -euo pipefail
          (
            cd "$GITHUB_WORKSPACE/base/.github/schemas"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Compare rendered schemas without increasing debt
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          bash base/scripts/ci/run_quality_ratchet.sh \
            --tool kubeconform \
            --base-root "$GITHUB_WORKSPACE/quality-ratchet/base-kubeconform-input" \
            --head-root "$GITHUB_WORKSPACE/quality-ratchet/head-kubeconform-input" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --report-dir "$GITHUB_WORKSPACE/quality-ratchet" \
            --schema-location "$GITHUB_WORKSPACE/base/.github/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Publish the effect of candidate kubeconform schema policy
        if: needs.detect.outputs.kubeconform_policy_changed == 'true'
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          bash base/scripts/ci/run_kubeconform_policy_effect.sh \
            --rendered-root "$GITHUB_WORKSPACE/quality-ratchet/base-kubeconform-input" \
            --base-schemas-root "$GITHUB_WORKSPACE/base/.github/schemas" \
            --base-catalog-commit "${CRDS_CATALOG_COMMIT}" \
            --candidate-workflow "$GITHUB_WORKSPACE/.github/workflows/pr-gate.yml" \
            --candidate-schemas-root "$GITHUB_WORKSPACE/.github/schemas" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --report-dir "$RUNNER_TEMP/quality-policy" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Scan trusted base Kubernetes configuration for ratchet comparison
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: quality-ratchet/base-rendered
          framework: kubernetes
          quiet: true
          skip_results_upload: true
          output_format: json
          output_file_path: quality-ratchet/base-checkov.json,
          config_file: base/.github/checkov.yaml
          soft_fail: true

      - name: Scan proposed Kubernetes configuration for ratchet comparison
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: quality-ratchet/head-rendered
          framework: kubernetes
          quiet: true
          skip_results_upload: true
          output_format: json
          output_file_path: quality-ratchet/head-checkov.json,
          config_file: base/.github/checkov.yaml
          soft_fail: true

      - name: Normalize Checkov JSON reports for trusted comparison
        run: |
          python3 base/scripts/ci/normalize_checkov_reports.py \
            --report "$GITHUB_WORKSPACE/quality-ratchet/base-checkov.json" "$RUNNER_TEMP/quality-ratchet/base-checkov.json" \
            --report "$GITHUB_WORKSPACE/quality-ratchet/head-checkov.json" "$RUNNER_TEMP/quality-ratchet/head-checkov.json"

      - name: Compare Kubernetes security findings without increasing debt
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/quality-ratchet"
          python3 base/scripts/ci/quality_ratchet.py \
            --tool checkov \
            --base-report "$workspace/base-checkov.json" \
            --head-report "$workspace/head-checkov.json" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --report "$workspace/quality-checkov.json" \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --github-annotations

      - name: Upload GitOps quality-ratchet reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: quality-ratchet-gitops-${{ github.event.pull_request.number }}
          path: |
            quality-ratchet/quality-kubeconform.json
            ${{ runner.temp }}/quality-policy/quality-kubeconform.json
            ${{ runner.temp }}/quality-ratchet/quality-checkov.json
          if-no-files-found: warn
          retention-days: 7

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.helm == 'true'
    steps:
      - name: Check out proposed charts as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart lint
        run: ct lint --config ct.yaml --target-branch main

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2 --verify=false

      - name: Run chart unit tests
        run: |
          helm unittest charts/cron-job
          helm unittest charts/onechart

  coder:
    name: Coder template validation
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.coder == 'true'
    steps:
      - name: Check out proposed templates as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted base for changed-template detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: base
          persist-credentials: false

      - name: Fetch and identify changed templates
        env:
          BASE_SHA: ${{ needs.detect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 base/scripts/ci/collect_changed_coder_templates.py \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER" \
            --output "$RUNNER_TEMP/changed-coder-templates"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate changed templates without credentials
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          bash base/scripts/ci/validate_coder_templates.sh \
            --root "$GITHUB_WORKSPACE" \
            --template-file "$RUNNER_TEMP/changed-coder-templates"

      - name: Scan changed templates (advisory pending issue #65)
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: coder/templates
          framework: terraform
          quiet: true
          soft_fail: true

  actions:
    name: Actions and scripts validation
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.actions == 'true'
    steps:
      - name: Check out proposed workflows and scripts as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted actionlint configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.base_sha }}
          path: base
          persist-credentials: false

      - name: Install checksum-verified actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          cp base/.github/actionlint.yaml .github/actionlint.yaml
          actionlint .github/workflows/*.yml .github/workflows/*.yaml

      - name: Check shell syntax and lint without executing scripts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash base/scripts/ci/lint_shell_scripts.sh --root "$GITHUB_WORKSPACE"

  functions:
    name: Functions specification validation
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.functions == 'true'
    steps:
      - name: Check out proposed function specs as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          persist-credentials: false

      - name: Install YAML linter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Lint Fission specifications without cluster access
        run: yamllint -c .yamllint.yaml functions

  required:
    name: required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect
      - baseline
      - critical
      - gitops
      - helm
      - coder
      - actions
      - functions
    steps:
      - name: Fail closed unless every applicable validator passed
        env:
          DETECT: ${{ needs.detect.result }}
          BASELINE: ${{ needs.baseline.result }}
          CRITICAL: ${{ needs.critical.result }}
          GITOPS: ${{ needs.gitops.result }}
          HELM: ${{ needs.helm.result }}
          CODER: ${{ needs.coder.result }}
          ACTIONS: ${{ needs.actions.result }}
          FUNCTIONS: ${{ needs.functions.result }}
          GITOPS_APPLICABLE: ${{ needs.detect.outputs.gitops }}
          HELM_APPLICABLE: ${{ needs.detect.outputs.helm }}
          CODER_APPLICABLE: ${{ needs.detect.outputs.coder }}
          ACTIONS_APPLICABLE: ${{ needs.detect.outputs.actions }}
          FUNCTIONS_APPLICABLE: ${{ needs.detect.outputs.functions }}
        run: |
          set -euo pipefail
          test "$DETECT" = success
          test "$BASELINE" = success
          test "$CRITICAL" = success

          for validator in gitops helm coder actions functions; do
            upper="$(printf '%s' "$validator" | tr '[:lower:]' '[:upper:]')"
            eval "applicable=\${${upper}_APPLICABLE}"
            eval "result=\${${upper}}"
            if [ "$applicable" = true ]; then
              test "$result" = success || {
                echo "::error::${validator} validation was applicable but ended as ${result}"
                exit 1
              }
            else
              test "$result" = skipped || {
                echo "::error::${validator} validation was not applicable but ended as ${result}"
                exit 1
              }
            fi
          done

          echo "All applicable validators passed."
