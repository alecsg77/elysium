name: PR Validate Coder Templates

on:
  pull_request:
    paths:
      - 'coder/templates/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed Coder templates
        id: changes
        run: |
          {
            echo "TEMPLATES<<EOF"
            git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- coder/templates \
              | xargs ls -d 2>/dev/null \
              | sed -r 's/^coder\/templates\/([^\/]+).*$/\1/' \
              | sort | uniq
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Define matrix based on changed templates
        id: matrix
        run: |
          if [ -n "$TEMPLATES" ]; then
            echo "templates=$(echo "$TEMPLATES" | jq -c -R -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          else
            echo "templates=[]" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      templates: ${{ steps.matrix.outputs.templates }}

  validate:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.detect-changes.outputs.templates) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: ./coder/templates/${{ matrix.template }}

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: ./coder/templates/${{ matrix.template }}

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: ./coder/templates/${{ matrix.template }}

      # NOTE: tflint is intentionally not run here. Terraform validate + checkov already cover
      # syntax/config correctness and security posture; adding tflint would require maintaining a
      # separate ruleset/config with no immediate rule set defined for these templates, which is
      # out of scope for this validation-only workflow. It can be added later as its own step.
      #
      # soft_fail is deliberate and temporary: Checkov currently reports real, pre-existing
      # Kubernetes pod security-posture findings on these templates (e.g. missing liveness/
      # readiness probes, no read-only root filesystem, NET_RAW not dropped, no digest-pinned
      # images). These reflect genuine gaps in currently-running Coder workspace templates, not
      # false positives, but remediating them here would require careful per-template testing to
      # avoid breaking active dev workspaces, which is out of scope for wiring up this validation
      # workflow. Findings are tracked in issue #65, where they'll be fixed incrementally; once
      # resolved, remove soft_fail so Checkov blocks regressions again.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: coder/templates/${{ matrix.template }}
          framework: terraform
          quiet: true
          soft_fail: true

      - name: Extract README frontmatter
        id: frontmatter
        continue-on-error: true
        uses: mheap/markdown-meta-action@f2cf287beda7ee926c7c504e9e2adc803d2bb958 # v1.0.1
        with:
          file: ./coder/templates/${{ matrix.template }}/README.md

      # Non-blocking: the publish workflow (publish-coder-templates.yaml) already relies on these
      # frontmatter fields silently; this only warns so authors notice a missing field before merge.
      - name: Warn on missing README frontmatter (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ steps.frontmatter.outcome }}" != "success" ]; then
            echo "::warning::coder/templates/${{ matrix.template }}/README.md frontmatter could not be read (missing file or invalid frontmatter)."
            exit 0
          fi
          [ -z "${{ steps.frontmatter.outputs.displayname }}" ] && echo "::warning::coder/templates/${{ matrix.template }}/README.md is missing 'displayname' in frontmatter." || true
          [ -z "${{ steps.frontmatter.outputs.description }}" ] && echo "::warning::coder/templates/${{ matrix.template }}/README.md is missing 'description' in frontmatter." || true
          [ -z "${{ steps.frontmatter.outputs.icon }}" ] && echo "::warning::coder/templates/${{ matrix.template }}/README.md is missing 'icon' in frontmatter." || true
