name: Publish Coder Template

on:
  push:
    branches: [main]
    paths:
      - coder/templates/**

  workflow_dispatch:
    inputs:
      publish_all:
        description: "Publish all templates regardless of changes"
        required: false
        default: false
        type: boolean
      since:
        description: "Oldest commit SHA to compare against for changed templates. Defaults to the last commit on the main branch."
        required: true
        default: "HEAD"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-coder-templates-main
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed Coder templates
        id: changes
        run: |
          {
            echo "TEMPLATES<<EOF"
            if [ "${{ inputs.publish_all }}" == "true" ]; then
              # Publish all templates
              find coder/templates -mindepth 1 -maxdepth 1 -type d -exec basename {} \;
            else
              # Only changed templates.
              base_ref="${{ inputs.since || github.event.commits[0].id }}~1"
              head_ref="${{ github.sha }}"
              git diff --name-only "$base_ref" "$head_ref" -- coder/templates \
                | xargs -r -n1 dirname \
                | sed -nE 's#^coder/templates/([^/]+).*#\1#p' \
                | sort -u
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Get latest commit title to use as template version description
        id: message
        run: |
          echo "pr_message=$(git log --format=%s -n 1 "${{ github.sha }}")" >> "$GITHUB_OUTPUT"

      - name: Define matrix based on changed templates
        id: matrix
        run: |
          if [ -n "$TEMPLATES" ]; then
            echo "templates=$(printf '%s' "$TEMPLATES" | jq -c -R -s 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          else
            echo "templates=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Coder templates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: templates
          path: coder/templates
    
    outputs:
      version_message: ${{ steps.message.outputs.pr_message }}
      templates: ${{ steps.matrix.outputs.templates }}

  publish:
    # Configure this repository environment to allow only main and scope the
    # Coder session token. The publish job never runs for a pull request.
    environment: coder-production
    runs-on: coder-runner-set
    needs: init
    if: needs.init.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.init.outputs.templates) }}

    steps:
      - name: Download Coder templates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: templates

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      
      - name: Set up terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Set up Coder CLI
        uses: coder/setup-action@4a607a8113d4e676e2d7c34caa20a814bc88bfda # v1.0.0
        with:
          access_url: "http://coder.coder.svc"
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Validate Terraform template
        run: |
          terraform init -input=false -backend=false
          terraform validate -no-color
        working-directory: ./${{ matrix.template }}

      - name: Push template to Coder
        run: |
          coder templates push ${{ matrix.template }} -d ${{ matrix.template }} --message "${{ needs.init.outputs.version_message }}" --yes

      - name: Extract README frontmatter
        id: frontmatter
        uses: mheap/markdown-meta-action@f2cf287beda7ee926c7c504e9e2adc803d2bb958 # v1.0.1
        with:
          file: ./${{ matrix.template }}/README.md

      - name: Set template display name
        if: steps.frontmatter.outputs.displayname != ''
        run: 
          coder templates edit ${{ matrix.template }} --display-name "${{ steps.frontmatter.outputs.displayname }}"

      - name: Set template description
        if: steps.frontmatter.outputs.description != ''
        run: 
          coder templates edit ${{ matrix.template }} --description "${{ steps.frontmatter.outputs.description }}"
      
      - name: Set template icon
        if: steps.frontmatter.outputs.icon != ''
        run: 
            coder templates edit ${{ matrix.template }} --icon "${{ steps.frontmatter.outputs.icon }}"
