---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
  annotations:
    # Protect monitoring controller reconciliation from accidental root-sync pruning.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Preserve managed resources if this child Kustomization is deleted.
  deletionPolicy: Orphan
  path: ./clusters/kyrion/monitoring/controllers
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
  annotations:
    # Protect monitoring configuration reconciliation from root-sync pruning.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Preserve managed resources if this child Kustomization is deleted.
  deletionPolicy: Orphan
  path: ./monitoring/configs
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-vars
