apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../infrastructure/configs
  - dns-cloudflare-sealed-secret.yaml

patches:
  - target:
      group: cert-manager.io
      version: v1
      kind: ClusterIssuer
      name: letsencrypt
    patch: |-
      - op: replace
        path: /spec/acme/server
        value: https://acme-v02.api.letsencrypt.org/directory
  - target:
      group: tailscale.com
      version: v1alpha1
      kind: Connector
      name: connector
      namespace: tailscale
    patch: |-
      - op: add
        path: /spec/hostname
        value: svizzera
      - op: add
        path: /spec/subnetRouter
        value:
          advertiseRoutes:
            - 10.43.0.0/16
            - 10.42.0.0/16
