apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The FluxInstance sync Kustomization must render only these bootstrap resources.
# Nested manifests are rendered by their dedicated child Kustomizations, which
# provide the required cluster-specific post-build substitutions.
resources:
  - apps.yaml
  - config-map.yaml
  - infrastructure.yaml
  - monitoring.yaml
  - sealed-secrets.yaml
