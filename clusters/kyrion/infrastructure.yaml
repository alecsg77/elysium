---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  path: ./clusters/kyrion/infrastructure/controllers
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 5m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  path: ./clusters/kyrion/infrastructure/configs
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-vars
