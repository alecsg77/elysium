---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
  annotations:
    # Protect the controller dependency boundary from accidental root-sync pruning.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  retryInterval: 5m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Preserve managed resources if this child Kustomization is deleted.
  deletionPolicy: Orphan
  prune: true
  wait: true
  path: ./clusters/kyrion/infrastructure/controllers
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
  annotations:
    # Protect configuration and access-plane reconciliation from root-sync pruning.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 5m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Preserve managed resources if this child Kustomization is deleted.
  deletionPolicy: Orphan
  prune: true
  wait: true
  path: ./clusters/kyrion/infrastructure/configs
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secret-vars
