suite: test deployment
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: Should set name, image and tag  
    set:
      initContainers:
        - name: pod1
          image: nginx
          tag: 1.2.2
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].name
          value: pod1
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].image
          value: "nginx:1.2.2"
  - it: Should append an immutable digest to the init container image
    set:
      initContainers:
        - name: pod1
          image: nginx
          tag: 1.2.2
          digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].image
          value: "nginx:1.2.2@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  - it: Should inherit the main digest-pinned image when an init image is omitted
    set:
      image:
        repository: ghcr.io/example/application
        tag: v1.2.3
        digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        pullPolicy: Always
      initContainers:
        - name: pod1
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].image
          value: "ghcr.io/example/application:v1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always

  - it: Should retain explicit init-container image overrides
    set:
      image:
        repository: ghcr.io/example/application
        tag: v1.2.3
        digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        pullPolicy: Always
      initContainers:
        - name: pod1
          image: busybox
          tag: 1.37.0
          digest: sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          imagePullPolicy: Never
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].image
          value: "busybox:1.37.0@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Never

  - it: Should set command  
    set:
      initContainers:
        - name: pod1
          image: nginx
          tag: 1.2.2
          command: "while true; do date; sleep 2; done &&
                      ls /data &&
                      printf something"
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].command
          value: ['/bin/sh', '-c', 'while true; do date; sleep 2; done && ls /data && printf something']

  - it: Should set security context and resources
    set:
      initContainers:
        - name: pod1
          image: nginx
          tag: 1.2.2
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
