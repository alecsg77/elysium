suite: test deployment
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: Should set a readiness probe
    set:
      probe:
        enabled: true
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: "/"
              port: 80
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
            failureThreshold: 3
  - it: Should not set a readinessProbe
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        isNull:
          path: spec.template.spec.containers[0].readinessProbe
  - it: Should tune readiness probe
    set:
      probe:
        enabled: true
        settings:
          periodSeconds: 30
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: "/"
              port: 80
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 3
            failureThreshold: 3
  - it: Should merge HTTPS headers and a startup probe into readiness
    set:
      probe:
        enabled: true
      container:
        readinessProbe:
          httpGet:
            scheme: HTTPS
            httpHeaders:
              - name: Host
                value: app.example.test
        startupProbe:
          httpGet:
            path: /startup
            port: 80
            scheme: HTTPS
          periodSeconds: 5
          failureThreshold: 24
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: "/"
              port: 80
              scheme: HTTPS
              httpHeaders:
                - name: Host
                  value: app.example.test
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
            failureThreshold: 3
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /startup
              port: 80
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 24
  - it: Should replace generated HTTP readiness with an exec probe
    set:
      probe:
        enabled: true
      container:
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - test -f /tmp/ready
          periodSeconds: 5
          failureThreshold: 6
    asserts:
      - template: deployment.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/ready
            initialDelaySeconds: 0
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
            failureThreshold: 6
