image:
  repository: nginx
  tag: "latest"
  # Optional full OCI digest, e.g. sha256:<64 hexadecimal characters>.
  digest: ""
  pullPolicy: IfNotPresent

# ingress:
#   host: chart-example.local
#   ingressClassName: nginx
#   tlsEnabled: true
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-staging
#   nginxBasicAuth:
#     user: admin
#     password: secret

# vars:
#   MY_VAR: "value"

# Optional init containers accept image, tag, and an optional immutable digest.
# initContainers:
#   - name: initialize-data
#     image: example/init
#     tag: v1.2.3
#     digest: sha256:<64 hexadecimal characters>

replicas: 1

# Empty preserves the automatic Recreate strategy for a single replica with a volume.
# Set to Recreate or RollingUpdate to override that default.
strategy: ""

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext: {}

containerPort: 80

resources:
  requests:
    cpu: "200m"
    memory: "200Mi"
  limits:
    cpu: "200m"
    memory: "200Mi"

nodeSelector: {}

tolerations: []

probe:
  enabled: false
  path: "/"
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

# Before you use a liveness probe: https://srcco.de/posts/kubernetes-liveness-probes-are-dangerous.html
livenessProbe:
  enabled: false
  path: "/"
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

secretEnabled: false

shell: "/bin/sh"

podDisruptionBudgetEnabled: true
spreadAcrossNodes: false

nodePortEnabled: false

# Set true to enable service monitor.
monitor:
  enabled: false

# Merged into the generated main container. Use it for complete Kubernetes probe
# objects (for example exec, HTTPS, custom HTTP headers, or startupProbe) when the
# HTTP readiness/liveness shorthand above is not sufficient.
container: {}

# Merged into the generated PodSpec for Kubernetes fields not exposed directly by
# OneChart, such as automountServiceAccountToken.
podSpec: {}
