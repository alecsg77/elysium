apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp-https
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana-mcp.${PRIVATE_DOMAIN}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: grafana-mcp
    app.kubernetes.io/component: mcp-server
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: mcp-http
