---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana-mcp
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
      interval: 60m
  dependsOn:
    - name: kube-prometheus-stack
  values:
    # Official Grafana MCP Server image
    image:
      repository: grafana/mcp-grafana  # {"$imagepolicy": "flux-system:grafana-mcp-policy:name"}
      tag: ""  # {"$imagepolicy": "flux-system:grafana-mcp-policy:tag"}
      registry: docker.io

    # Use Grafana's externally named HTTPS endpoint so TLS SNI matches the
    # namespace wildcard certificate mounted by the Grafana workload.
    grafana:
      url: "https://grafana.${PRIVATE_DOMAIN}"
      apiKey: ""  # Set via GRAFANA_SERVICE_ACCOUNT_TOKEN from sealed secret

    # Environment variables from sealed secret
    # The sealed secret contains only:
    # - GRAFANA_SERVICE_ACCOUNT_TOKEN: <service account token from Grafana>
    envFrom:
      - secretRef:
          name: grafana-mcp-credentials

    # Resource configuration
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Transport mode: Use Streamable HTTP (MCP protocol 2025-06-18)
    # Supports both modern clients (POST /sse) and legacy clients (GET /sse).
    # TLS terminates in the MCP server; the externally exposed Service is
    # maintained separately to map port 443 to this chart's native port 8000.
    extraArgs:
      - "-t"
      - "streamable-http"
      - "--server.tls-cert-file"
      - "/etc/grafana-mcp/tls/tls.crt"
      - "--server.tls-key-file"
      - "/etc/grafana-mcp/tls/tls.key"
    volumeMounts:
      - name: monitoring-wildcard-tls
        mountPath: /etc/grafana-mcp/tls
        readOnly: true
    volumes:
      - name: monitoring-wildcard-tls
        secret:
          secretName: monitoring-wildcard-tls

    ingress:
      enabled: false
---
# ImageRepository for automated image updates
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: grafana-mcp
  namespace: flux-system
spec:
  image: docker.io/grafana/mcp-grafana
  interval: 24h
---
# ImagePolicy for automated image updates
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: grafana-mcp-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: grafana-mcp
  policy:
    semver:
      range: "*"
