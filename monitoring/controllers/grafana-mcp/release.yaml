---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana-mcp
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
      interval: 60m
  dependsOn:
    - name: kube-prometheus-stack
  valuesFrom:
    - kind: ConfigMap
      name: grafana-mcp-image-auto
      valuesKey: values.yaml
  values:
    # Keep the registry pinned while the ResourceSet supplies repository and tag.
    image:
      registry: docker.io

    # Use Grafana's externally named HTTPS endpoint so TLS SNI matches the
    # namespace wildcard certificate mounted by the Grafana workload.
    grafana:
      url: "https://grafana.${PRIVATE_DOMAIN}"
      apiKey: ""  # Set via GRAFANA_SERVICE_ACCOUNT_TOKEN from sealed secret

    # Environment variables from sealed secret
    # The sealed secret contains only:
    # - GRAFANA_SERVICE_ACCOUNT_TOKEN: <service account token from Grafana>
    envFrom:
      - secretRef:
          name: grafana-mcp-credentials

    # The chart renders podAnnotations on the Deployment pod template. Update
    # this non-secret SHA-256 when the SealedSecret changes so envFrom is read
    # by a newly rolled-out pod.
    podAnnotations:
      checksum/grafana-mcp-credentials: "sha256-e0b685fc-47b79532-182d4272-215fef72-b6d651fc-1899a990-fc3f4123-41c12a78"

    # Resource configuration
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Streamable HTTP is available only through the cluster Service. Do not add
    # TLS arguments or an ExternalDNS Service: this MCP server is intentionally
    # not exposed through private DNS or a Tailscale Ingress.
    extraArgs:
      - "-t"
      - "streamable-http"
      # Permit only the Host header sent for the internally configured Service.
      - "--allowed-hosts"
      - "grafana-mcp.monitoring.svc:8000"

    ingress:
      enabled: false
