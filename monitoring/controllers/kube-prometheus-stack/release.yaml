apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics-config
      valuesKey: kube-state-metrics-config.yaml
    - kind: Secret
      name: kube-prometheus-stack-values
      valuesKey: control-plane-endpoint
      targetPath: kubeControllerManager.endpoints[0]
    - kind: Secret
      name: kube-prometheus-stack-values
      valuesKey: control-plane-endpoint
      targetPath: kubeScheduler.endpoints[0]
    - kind: Secret
      name: kube-prometheus-stack-values
      valuesKey: control-plane-endpoint
      targetPath: kubeEtcd.endpoints[0]
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    alertmanager:
      ingress:
        enabled: false
      service:
        port: 443
        targetPort: 9093
        annotations:
          external-dns.alpha.kubernetes.io/hostname: alertmanager.${PRIVATE_DOMAIN}
      serviceMonitor:
        scheme: https
        tlsConfig:
          serverName: alertmanager.${PRIVATE_DOMAIN}
      alertmanagerSpec:
        externalUrl: https://alertmanager.${PRIVATE_DOMAIN}
        scheme: https
        tlsConfig:
          serverName: alertmanager.${PRIVATE_DOMAIN}
        web:
          tlsConfig:
            cert:
              secret:
                name: monitoring-wildcard-tls
                key: tls.crt
            keySecret:
              name: monitoring-wildcard-tls
              key: tls.key
        forceEnableClusterMode: true
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    prometheus:
      ingress:
        enabled: false
      service:
        port: 443
        targetPort: 9090
        annotations:
          external-dns.alpha.kubernetes.io/hostname: prometheus.${PRIVATE_DOMAIN}
      serviceMonitor:
        scheme: https
        tlsConfig:
          serverName: prometheus.${PRIVATE_DOMAIN}
      prometheusSpec:
        externalUrl: https://prometheus.${PRIVATE_DOMAIN}
        web:
          tlsConfig:
            cert:
              secret:
                name: monitoring-wildcard-tls
                key: tls.crt
            keySecret:
              name: monitoring-wildcard-tls
              key: tls.key
        retention: 7d
        walCompression: true
        scrapeInterval: 60s
        relabelConfigs:
          - sourceLabels: [__name__]
            regex: 'kube_pod_container_info|kube_pod_info'
            action: drop
          - sourceLabels: [pod]
            regex: '.*-debug|.*-test'
            action: drop
          # Additional high-cardinality drops to reduce TSDB head series
          - sourceLabels: [__name__]
            regex: 'kube_pod_labels|kube_pod_owner|kube_pod_container_status_restarts_total'
            action: drop
          - sourceLabels: [container]
            regex: '.*-debug|.*-test'
            action: drop
          # Remove noisy label that increases series cardinality
          - sourceLabels: [__meta_kubernetes_pod_label_pod_template_hash]
            regex: '(.+)'
            action: labeldrop
        storage.tsdb.max_block_duration: 4h
        storage.tsdb.min_block_duration: 2h
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: 1
            memory: 3Gi
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
    grafana:
      defaultDashboardsTimezone: browser
      ingress:
        enabled: false
      service:
        port: 443
        targetPort: 3000
        annotations:
          external-dns.alpha.kubernetes.io/hostname: grafana.${PRIVATE_DOMAIN}
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
          scheme: HTTPS
      livenessProbe:
        httpGet:
          path: /api/health
          port: grafana
          scheme: HTTPS
        initialDelaySeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      extraSecretMounts:
        - name: monitoring-wildcard-tls
          secretName: monitoring-wildcard-tls
          defaultMode: 0440
          mountPath: /etc/grafana/tls
          readOnly: true
      persistence:
        enabled: true
      grafana.ini:
        server:
          protocol: https
          cert_file: /etc/grafana/tls/tls.crt
          cert_key: /etc/grafana/tls/tls.key
          domain: grafana.${PRIVATE_DOMAIN}
          root_url: https://grafana.${PRIVATE_DOMAIN}
    kubeControllerManager:
      # Endpoint comes from the cluster-scoped values Secret.
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      # Endpoint comes from the cluster-scoped values Secret.
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeEtcd:
      # Endpoint comes from the cluster-scoped values Secret.
      service:
        port: 2381
        targetPort: 2381
    kubeProxy:
      service:
        port: 10249
        targetPort: 10249
        selector:
          k8s-app: pushprox-kube-proxy-client
      serviceMonitor:
        proxyUrl: http://pushprox-kube-proxy-proxy.kube-system.svc:8080
        https: false
        relabelings:
          - action: replace
            sourceLabels:
              - __meta_kubernetes_pod_ip
            targetLabel: pod_ip
          - action: replace
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: instance

    prometheus-node-exporter:
      hostNetwork: false
      hostPID: false
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels:
                - __meta_kubernetes_pod_ip
              targetLabel: pod_ip
            - action: replace
              sourceLabels:
                - __meta_kubernetes_pod_node_name
              targetLabel: instance
